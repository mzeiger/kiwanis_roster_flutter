<link href="https://cdnjs.cloudflare.com/ajax/libs/tabulator/2.11.0/tabulator.min.css" rel="stylesheet">

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/tabulator/2.11.0/tabulator.min.js"></script>

</head>

<body>
<label for="">Last Name Search : </label><input id="filter" /> &nbsp; &nbsp;
<button id="clearSearch">Clear Search</button><br/> <br/>
<div id="example-table" style="width:90%; margin:20px;padding:20px;background-color:lightgrey;"></div>

<script type="text/javascript">
$( function() {
  $("#clearSearch").click( function() {
       $("#example-table").tabulator("clearFilter");
       $("#filter").val("");
    }
  );
  $("#filter").keyup(function() {
      filterStr = $("#filter").val();
     // alert(filterStr);
      $("#example-table").tabulator("setFilter", "lastname", "like", filterStr);
    }
  );
  //create Tabulator on DOM element with id "example-table"
  $("#example-table").tabulator({
    fitColumns:true,
    layout:"fitData",
    movableRows:false,
    movableColumns: false,
    //height:"300px",
    paginationSize:20,
    pagination:"local",

    ajaxURL:"http://monumenthillkiwanis.org/ionic/roster_json1.php", //ajax URL
    ajaxProgressiveLoad:"load", //enable progressive loading
    ajaxProgressiveLoadDelay:1, //wait 1 milliseconds between each request

    columns:[
        {title:"Last Name", field:"lastname", sorter:"string", width:150, sortable:false},
        {title:"First Name", field:"firstname", sorter:"string", align:"left", sortable:false},
        {title:"Email", field:"email", sorter:"string", formatter:"email", sortable:false},
        {title: "Address", field: "cb_address", sortable:false},
        {title:"City", field:"cb_city", sorter:"string", align:"left", sortable:false},
        {title:"State", field:"cb_state"},
        {title:"Zip", field:"cb_zipcode"},
        {title:"Home Phone", field:"cb_homephone", sortable:false},
        {title:"Cell", field:"cb_mobilephone", sortable:false}    
    ],
    rowClick:function(e, id, data, row){
        str = data.lastname + ", " + data.firstname + "\n";
        str += data.cb_address + "\n" + data.cb_city + ", " + data.cb_state + " " + data.cb_zipcode + "\n";
        str += "Home Phone: " + data.cb_homephone + "\n";
        str += "Cell Phone: "  + data.cb_mobilephone  +"\n" ;
        alert(str);
    }
});
